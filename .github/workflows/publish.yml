name: Verifica e pubblica Be One Team Opportunity
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Recupera i file
        uses: actions/checkout@v4
      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifica struttura e referenti
        run: node scripts/validate.cjs
      - name: Pubblica nello stesso progetto Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 547875c3b9e75017cb7fc21eb0e99f6a
          command: pages deploy site --project-name=beoneteamopportunity --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Segnala autorizzazione Cloudflare mancante
        if: ${{ env.CF_TOKEN == '' }}
        run: echo 'Pubblicazione sospesa. Manca CLOUDFLARE_API_TOKEN in Settings > Secrets and variables > Actions.'
