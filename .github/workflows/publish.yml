name: Verifica e pubblica Be One Team Opportunity (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recupera i file
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verifica struttura, percorsi e referenti
        run: node scripts/validate.cjs

      - name: Inizializza GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepara i file del sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
